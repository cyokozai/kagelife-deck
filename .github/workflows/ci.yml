name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: libudev を入れる（hidapi が使う）
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libudev-dev
      - name: Rust の stable と rustfmt・clippy
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: 書式
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: テスト
        run: cargo test --locked

  # macOS（Apple Silicon）でのテストとリリースビルド。DJ 卓の Mac に置く実行ファイルを作る
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust の stable
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: テスト
        run: cargo test --locked
      - name: リリースビルド
        run: cargo build --release --locked
      - name: 実行ファイルを確かめる
        run: file target/release/kagelife-deck && ls -l target/release/kagelife-deck
      - uses: actions/upload-artifact@v4
        with:
          name: kagelife-deck-aarch64-apple-darwin
          path: target/release/kagelife-deck
          if-no-files-found: error
